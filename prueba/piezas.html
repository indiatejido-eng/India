<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Las piezas (prueba) · India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet">
<style>
  /* Mismos tokens que index.html — si esto pasa a la home, se pega tal cual */
  :root{
    --bg: #f3ece0;
    --bg-soft: #ece2d1;
    --ink: #221a13;
    --ink-soft: #4a3a2a;
    --muted: #8a7558;
    --line: #c9b896;
    --accent: #8b6535;
    --cream: #faf5ea;
    --maxw: 1340px;
    --gutter: 48px;
  }
  *{ margin:0; padding:0; box-sizing:border-box }
  body{
    background-color: var(--bg);
    background-image: radial-gradient(130% 95% at 50% -12%, #f9f3e8 0%, var(--bg) 46%, #e7d9c1 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  a{ color:inherit; text-decoration:none }

  .tag{ position:fixed; top:0; left:0; right:0; z-index:30; background:var(--ink); color:var(--cream); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; text-align:center; padding:7px 10px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
  .tag button{ font:inherit; letter-spacing:.14em; text-transform:uppercase; background:transparent; border:1px solid rgba(250,245,234,.4); color:inherit; border-radius:100px; padding:3px 11px; cursor:pointer; }
  .tag button[aria-pressed="true"]{ background:var(--cream); color:var(--ink); border-color:var(--cream); }

  /* ===== Cabecera: centrada, poquísimo texto ===== */
  .sec-head{ text-align:center; padding: 132px 24px 0; }
  .label{ display:block; font-size:.68rem; font-weight:600; letter-spacing:.32em; text-transform:uppercase; color:var(--muted); margin-bottom:22px; }
  .display{ font-family:'Fraunces',serif; font-weight:400; font-size:clamp(2.2rem,3.6vw,3.2rem); line-height:1.1; letter-spacing:-.02em; }
  .display .it{ font-style:italic; font-weight:300; color:var(--accent); }

  /* ===== DESTACADAS — la pieza entera, flotando y centrada sobre el panel arena.
     Es lo que hacen las marcas del rubro: la prenda nunca se recorta ni toca el borde. ===== */
  .dest{ padding: 34px 0 0; }
  .dest-item{ display:block; padding: 46px 0; }
  .dest-panel{
    position:relative;
    width: min(78%, 620px);      /* el panel NO va de borde a borde: el aire de los costados es parte del diseño */
    margin: 0 auto;
    aspect-ratio: 4/5;
    background: var(--bg-soft);
    overflow:hidden;
  }
  /* `contain` + alto máximo: la pieza se ve ENTERA y centrada, nunca recortada ni gigante */
  .dest-panel img{
    position:absolute; inset:0; margin:auto;
    width:auto; height:auto;
    max-width:80%; max-height:80%;
    object-fit:contain;
    transition: transform 1.2s cubic-bezier(.2,.8,.2,1);
  }
  .dest-item:hover .dest-panel img{ transform: scale(1.025); }

  /* ===== LA TIRA — el resto, se desliza al costado. Mismo tratamiento, más chico ===== */
  .tira{ max-width: calc(var(--maxw) + var(--gutter) * 2); margin:0 auto; padding: 96px var(--gutter) 150px; }
  .tira .label{ text-align:center; margin-bottom:26px; }
  .ot-row{
    display:flex; gap:14px; overflow-x:auto; scroll-behavior:smooth;
    scrollbar-width:none; -ms-overflow-style:none; padding-bottom:4px;
    --ot-fade: 46px;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--ot-fade), #000 calc(100% - var(--ot-fade)), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 var(--ot-fade), #000 calc(100% - var(--ot-fade)), transparent 100%);
  }
  .ot-row::-webkit-scrollbar{ display:none }
  .ot-pieza{ flex:0 0 auto; width: 168px; position:relative; aspect-ratio:4/5; background:var(--bg-soft); overflow:hidden; }
  .ot-pieza img{ position:absolute; inset:0; margin:auto; width:auto; height:auto; max-width:78%; max-height:78%; object-fit:contain; }
  .ot-hint{ display:block; text-align:center; margin-top:22px; color:var(--muted); font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; }

  .vacio{ color:var(--muted); font-size:.95rem; text-align:center; padding:30px 0; }

  /* ===== CELULAR ===== */
  @media(max-width:880px){
    :root{ --gutter: 24px; }
    .sec-head{ padding-top: 92px; }
    .dest{ padding-top: 14px; }
    .dest-item{ padding: 30px 0; }
    .dest-panel{ width: 82%; }
    .tira{ padding: 62px var(--gutter) 110px; }
    .ot-pieza{ width: 140px; }
  }
</style>
</head>
<body>
<div class="tag">
  <span>Prueba · las piezas</span>
  <span>Destacadas:</span>
  <button type="button" data-n="2" aria-pressed="true">2</button>
  <button type="button" data-n="3" aria-pressed="false">3</button>
</div>

<section class="sec-head">
  <span class="label">Las piezas</span>
  <h2 class="display">Lo que <span class="it">tejemos.</span></h2>
</section>

<section class="dest" id="dest"><div class="vacio">Cargando…</div></section>

<section class="tira">
  <span class="label">Todas</span>
  <div class="ot-row" id="ot-1"></div>
  <span class="ot-hint">Deslizá →</span>
</section>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
  import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';
  import { firebaseConfig } from '/firebase-config.js';   // ruta absoluta: la página vive en /prueba/

  const db = getFirestore(initializeApp(firebaseConfig));

  // Misma transformación de Cloudinary que usa la home: recorta el fondo y deja la pieza sola
  const fotoUrl = (url, w = 1100) => {
    if (!url || typeof url !== 'string' || !url.includes('/image/upload/')) return url;
    return url.replace('/image/upload/', `/image/upload/e_background_removal/e_trim/f_auto,q_auto,w_${w},c_limit/`);
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  let piezas = [];
  let cuantas = 2;

  const pintar = () => {
    const dest = piezas.slice(0, cuantas);
    const resto = piezas.slice(cuantas);
    // Sin nombre, sin talle, sin precio, sin botón: la pieza sola. El nombre queda en el alt, para quien no ve la foto.
    document.getElementById('dest').innerHTML = dest.map(p => `
      <article class="dest-item">
        <div class="dest-panel"><img src="${fotoUrl(p.foto, 1100)}" alt="${esc(p.nombre)}" loading="lazy"></div>
      </article>`).join('') || '<div class="vacio">No hay piezas.</div>';
    document.getElementById('ot-1').innerHTML = resto.map(p => `
      <div class="ot-pieza"><img src="${fotoUrl(p.foto, 620)}" alt="${esc(p.nombre)}" loading="lazy"></div>`).join('');
  };

  document.querySelectorAll('.tag button').forEach(b => b.addEventListener('click', () => {
    cuantas = Number(b.dataset.n);
    document.querySelectorAll('.tag button').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    pintar();
  }));

  try {
    const [disp, ant] = await Promise.all([
      getDocs(query(collection(db, 'chalecos'), where('estado', '==', 'disponible'))),
      getDocs(query(collection(db, 'chalecos'), where('estado', '==', 'anterior')))
    ]);
    const leer = s => s.docs.map(d => d.data())
      .map(r => ({ nombre: r.nombre || '', foto: r.foto || '', orden: r.orden ?? 0 }))
      .filter(p => p.foto)
      .sort((a, b) => a.orden - b.orden);
    piezas = [...leer(disp), ...leer(ant)];
    pintar();
  } catch (e) {
    document.getElementById('dest').innerHTML = '<div class="vacio">No se pudieron cargar las piezas: ' + esc(e.message) + '</div>';
  }
</script>
</body>
</html>
