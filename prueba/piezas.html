<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Las piezas (prueba) · India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet">
<style>
  /* Mismos tokens que index.html — si esto pasa a la home, se pega tal cual */
  :root{
    --bg: #f3ece0;
    --bg-soft: #ece2d1;
    --ink: #221a13;
    --ink-soft: #4a3a2a;
    --muted: #8a7558;
    --accent: #8b6535;
    --cream: #faf5ea;
    --maxw: 1340px;
    --gutter: 48px;
    --panel: #e3d6bf;
  }
  *{ margin:0; padding:0; box-sizing:border-box }
  body{
    background-color: var(--bg);
    background-image: radial-gradient(130% 95% at 50% -12%, #f9f3e8 0%, var(--bg) 46%, #e7d9c1 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  a{ color:inherit; text-decoration:none }

  .tag{ position:fixed; top:0; left:0; right:0; z-index:30; background:var(--ink); color:var(--cream); font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; text-align:center; padding:6px 8px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .tag button{ font:inherit; letter-spacing:.12em; text-transform:uppercase; background:transparent; border:1px solid rgba(250,245,234,.4); color:inherit; border-radius:100px; padding:3px 10px; cursor:pointer; }
  .tag button[aria-pressed="true"]{ background:var(--cream); color:var(--ink); border-color:var(--cream); }
  .tag i{ font-style:normal; opacity:.6 }

  /* ===== Cabecera ===== */
  .sec-head{ padding: 118px var(--gutter) 0; }
  .label{ display:block; font-size:.68rem; font-weight:600; letter-spacing:.32em; text-transform:uppercase; color:var(--muted); margin-bottom:20px; }
  .display{ font-family:'Fraunces',serif; font-weight:400; font-size:clamp(2.2rem,3.6vw,3.2rem); line-height:1.1; letter-spacing:-.02em; }
  .display .it{ font-style:italic; font-weight:300; color:var(--accent); }

  /* ===== DESTACADAS — la foto a sangre, de borde a borde, con el chaleco puesto.
     Es lo que hacen Paul James y Douglas-Brown: la foto ocupa todo, sin marco ni panel. ===== */
  .dest{ padding: 46px 0 0; }
  .dest-item{ position:relative; height: 78vh; height: 78dvh; min-height: 480px; overflow:hidden; background:var(--bg-soft); }
  .dest-item + .dest-item{ margin-top: 10px; }
  .dest-item img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* Estas fotos NO vienen recortadas de Cloudinary: son escenas, así que acá `cover` es lo correcto */
  .dest-item::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(28,22,14,.66) 0%, rgba(28,22,14,.22) 34%, rgba(28,22,14,0) 62%); pointer-events:none; opacity:1; transition:opacity .4s; }
  .dest-txt{ position:absolute; left:0; right:0; bottom:0; z-index:2; padding: 0 var(--gutter) 40px; }
  .dest-eyebrow{ display:block; font-size:.62rem; font-weight:600; letter-spacing:.3em; text-transform:uppercase; color:rgba(250,245,234,.8); margin-bottom:12px; }
  .dest-frase{ font-family:'Fraunces',serif; font-weight:400; font-size:clamp(1.9rem,3vw,2.7rem); line-height:1.08; letter-spacing:-.02em; color:var(--cream); }
  .dest-frase em{ font-style:italic; font-weight:300; color:#e7d6b4; }
  /* Modo "sin texto": la foto sola, limpia */
  body.sin-texto .dest-txt{ display:none; }
  body.sin-texto .dest-item::after{ opacity:0; }

  /* ===== LA TIRA — el resto, se desliza al costado. Piezas recortadas sobre el panel arena ===== */
  .tira{ max-width: calc(var(--maxw) + var(--gutter) * 2); margin:0 auto; padding: 84px var(--gutter) 150px; }
  .ot-row{
    display:flex; gap:14px; overflow-x:auto; scroll-behavior:smooth;
    scrollbar-width:none; -ms-overflow-style:none; padding-bottom:4px;
    --ot-fade: 46px;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--ot-fade), #000 calc(100% - var(--ot-fade)), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 var(--ot-fade), #000 calc(100% - var(--ot-fade)), transparent 100%);
  }
  .ot-row::-webkit-scrollbar{ display:none }
  .ot-pieza{ flex:0 0 auto; width: 168px; position:relative; aspect-ratio:4/5; background:var(--panel); overflow:hidden; }
  .ot-pieza img{ position:absolute; inset:0; margin:auto; width:auto; height:auto; max-width:82%; max-height:82%; object-fit:contain; }
  .ot-hint{ display:block; text-align:center; margin-top:22px; color:var(--muted); font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; }

  /* ===== CELULAR ===== */
  @media(max-width:880px){
    :root{ --gutter: 24px; }
    .sec-head{ padding-top: 88px; }
    .dest{ padding-top: 26px; }
    .dest-item{ height: 76vh; height: 76dvh; min-height: 440px; }
    .dest-txt{ padding: 0 24px 34px; }
    .dest-frase{ font-size: 2.15rem; }
    .tira{ padding: 58px var(--gutter) 110px; }
    .ot-pieza{ width: 142px; }
  }
</style>
</head>
<body>
<div class="tag">
  <span>Prueba · las piezas</span>
  <i>Texto:</i>
  <button type="button" data-txt="si" aria-pressed="true">Sí</button>
  <button type="button" data-txt="no" aria-pressed="false">No</button>
  <i>Destacadas:</i>
  <button type="button" data-n="2" aria-pressed="true">2</button>
  <button type="button" data-n="3" aria-pressed="false">3</button>
</div>

<section class="sec-head">
  <span class="label">Las piezas</span>
  <h2 class="display">Lo que <span class="it">tejemos.</span></h2>
</section>

<section class="dest" id="dest">
  <article class="dest-item">
    <img src="/prueba/img/puesto-1.webp" alt="Chaleco marrón puesto, a caballo en el campo" loading="lazy">
    <div class="dest-txt">
      <span class="dest-eyebrow">Tejido a mano</span>
      <h3 class="dest-frase">Para <em>todos los días.</em></h3>
    </div>
  </article>
  <article class="dest-item">
    <img src="/prueba/img/puesto-2.webp" alt="Chaleco marrón con ochos puesto, sobre camisa" loading="lazy">
    <div class="dest-txt">
      <span class="dest-eyebrow">100% lana de oveja</span>
      <h3 class="dest-frase">Abriga <em>de verdad.</em></h3>
    </div>
  </article>
  <article class="dest-item tercera" hidden>
    <img src="/prueba/img/puesto-3.webp" alt="Chaleco gris con trenzas puesto" loading="lazy">
    <div class="dest-txt">
      <span class="dest-eyebrow">Con tus medidas</span>
      <h3 class="dest-frase">Te queda <em>a vos.</em></h3>
    </div>
  </article>
</section>

<section class="tira">
  <div class="ot-row" id="ot-1"></div>
  <span class="ot-hint">Deslizá →</span>
</section>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
  import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js';
  import { firebaseConfig } from '/firebase-config.js';   // ruta absoluta: la página vive en /prueba/

  const db = getFirestore(initializeApp(firebaseConfig));
  const fotoUrl = (url, w = 620) => {
    if (!url || typeof url !== 'string' || !url.includes('/image/upload/')) return url;
    return url.replace('/image/upload/', `/image/upload/e_background_removal/e_trim/f_auto,q_auto,w_${w},c_limit/`);
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  document.querySelectorAll('.tag button').forEach(b => b.addEventListener('click', () => {
    const grupo = b.dataset.txt ? '[data-txt]' : '[data-n]';
    document.querySelectorAll('.tag ' + grupo).forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    if (b.dataset.txt) document.body.classList.toggle('sin-texto', b.dataset.txt === 'no');
    else document.querySelector('.tercera').hidden = (b.dataset.n === '2');
  }));

  // La tira: todas las piezas del catálogo, recortadas sobre el panel
  try {
    const [disp, ant] = await Promise.all([
      getDocs(query(collection(db, 'chalecos'), where('estado', '==', 'disponible'))),
      getDocs(query(collection(db, 'chalecos'), where('estado', '==', 'anterior')))
    ]);
    const leer = s => s.docs.map(d => d.data())
      .map(r => ({ nombre: r.nombre || '', foto: r.foto || '', orden: r.orden ?? 0 }))
      .filter(p => p.foto).sort((a, b) => a.orden - b.orden);
    document.getElementById('ot-1').innerHTML = [...leer(disp), ...leer(ant)]
      .map(p => `<div class="ot-pieza"><img src="${fotoUrl(p.foto)}" alt="${esc(p.nombre)}" loading="lazy"></div>`).join('');
  } catch (e) {
    document.getElementById('ot-1').innerHTML = '<div style="color:var(--muted)">No se pudieron cargar las piezas.</div>';
  }
</script>
</body>
</html>
