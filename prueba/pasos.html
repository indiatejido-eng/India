<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Los tres pasos (prueba) · India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet">
<style>
  /* Mismos tokens que index.html — si esto pasa a la home, se pega tal cual */
  :root{
    --bg: #f3ece0;
    --bg-soft: #ece2d1;
    --ink: #221a13;
    --ink-soft: #4a3a2a;
    --muted: #8a7558;
    --accent: #8b6535;
    --cream: #faf5ea;
    --wa: #5e7548;
    --wa-deep: #4a5c39;
    --maxw: 1340px;
    --gutter: 48px;
  }
  *{ margin:0; padding:0; box-sizing:border-box }
  body{
    background-color: var(--bg);
    background-image: radial-gradient(130% 95% at 50% -12%, #f9f3e8 0%, var(--bg) 46%, #e7d9c1 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .tag{ position:fixed; top:0; left:0; right:0; z-index:20; background:var(--ink); color:var(--cream); font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; text-align:center; padding:6px; font-weight:600; }

  /* ===== Tres fotos, tres frases. Nada más. ===== */
  .ps{ padding: 120px 0 0; }
  .ps-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 18px; max-width: calc(var(--maxw) + var(--gutter) * 2); margin:0 auto; padding: 0 var(--gutter); }

  .ps-step{ position:relative; aspect-ratio: 3/4; overflow:hidden; background:var(--bg-soft); }
  .ps-step img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  /* La foto del dibujo es horizontal y se recorta a lo alto: corrida para que entren marrón liso, trenza y guarda pampa */
  .ps-step img.dibujo{ object-position: 33% 50%; }
  /* La frase va sobre la foto, con un velo suave abajo — nunca en una franja de color que la tape */
  .ps-step::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(28,22,14,.72) 0%, rgba(28,22,14,.30) 32%, rgba(28,22,14,0) 58%); pointer-events:none; }
  .ps-step h3{ position:absolute; left:0; right:0; bottom:0; z-index:2; padding: 0 30px 34px; font-family:'Fraunces',serif; font-weight:400; font-size:clamp(1.7rem,2.3vw,2.3rem); line-height:1.1; letter-spacing:-.015em; color:var(--cream); }
  .ps-step h3 em{ font-style:italic; font-weight:300; color:#e7d6b4; }

  /* ===== Cierre ===== */
  .ps-cta{ max-width: calc(var(--maxw) + var(--gutter) * 2); margin:0 auto; padding: 90px var(--gutter) 160px; text-align:center; }
  .ps-cta p{ font-family:'Fraunces',serif; font-weight:400; font-size:clamp(1.6rem,2.6vw,2.3rem); line-height:1.2; color:var(--ink); margin-bottom:34px; }
  .ps-cta p em{ font-style:italic; font-weight:300; color:var(--accent); }
  .btn{ display:inline-flex; align-items:center; gap:12px; background:var(--wa); color:#fff; padding:18px 32px; border-radius:100px; font-weight:500; font-size:1rem; text-decoration:none; box-shadow:0 18px 40px -15px rgba(94,117,72,.55); transition:all .3s; }
  .btn:hover{ background:var(--wa-deep); transform:translateY(-2px); }
  .btn svg{ width:20px; height:20px; fill:currentColor; flex-shrink:0; }

  /* ===== Celular: cada foto de borde a borde, una debajo de la otra ===== */
  @media(max-width:880px){
    .ps{ padding-top: 40px; }
    .ps-grid{ grid-template-columns: 1fr; gap: 0; padding: 0; max-width:none; }
    .ps-step{ aspect-ratio:auto; height: 74vh; height: 74dvh; min-height: 460px; }
    .ps-step h3{ padding: 0 24px 38px; font-size: 2.35rem; }
    .ps-cta{ padding: 70px 24px 110px; }
    .btn{ width:100%; justify-content:center; padding:16px 24px; }
  }
</style>
</head>
<body>
<div class="tag">Prueba · los tres pasos · no está linkeada desde el sitio</div>

<section class="ps">
  <div class="ps-grid">

    <div class="ps-step">
      <img class="dibujo" src="/prueba/img/paso-dibujo-3.webp" alt="Cuatro chalecos con dibujos distintos: liso, trenza, guarda pampa y veteado" loading="lazy">
      <h3>Elegís el <em>dibujo.</em></h3>
    </div>

    <div class="ps-step">
      <img src="/prueba/img/paso-color.webp" alt="Tres madejas de lana hilada a mano: marrón, gris y crudo" loading="lazy">
      <h3>Elegís el <em>color.</em></h3>
    </div>

    <div class="ps-step">
      <img src="/amedida.webp" alt="Cinta métrica sobre el tejido de lana con la etiqueta de cuero India" loading="lazy">
      <h3>Nos pasás tus <em>medidas.</em></h3>
    </div>

  </div>
</section>

<section class="ps-cta">
  <p>En diez días <em>lo tenés.</em></p>

</section>

</body>
</html>
